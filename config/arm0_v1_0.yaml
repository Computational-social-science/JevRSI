# Arm 0 -- our v1.0. Qwen3-0.6B + the RSI-Jev distillation recipe.
#
# WHAT THIS IS
#   The starting point of the curve. RSI-Jev's v1.0 is a Qwen3.5-2B-Base tower, fully fine-tuned
#   except the input embedding, with a fresh scorer on top, fitted for 1,500 steps to a teacher's
#   full probability distribution over the options. This file reproduces that recipe on a
#   Qwen3-0.6B backbone, and nothing else changes.
#
# WHY A NEW FILE AND NOT THE EXISTING ONE
#   agentjev/configs/autoresearch.yaml belongs to the previous 24/7 loop and is not this arm:
#     - init_from points at a 2.28 GB checkpoint that has ALREADY been trained on the typed-decisions
#       train split. Starting there is not a v1.0 reproduction; RSI-Jev's v1.0 saw no benchmark split
#       at all, and their whole first release is described as zero-shot for that reason.
#     - 600 steps, not 1,500; batch_states 4 x grad_accum 4 = 16 states, where theirs is batch 16
#       questions; and a data source pointed at the benchmark's own train split.
#   Reusing it would have made arm 0 a measurement of the wrong thing, and the number would have
#   looked fine.
#
# THE RECIPE, AND WHERE EACH NUMBER COMES FROM
#   base            Qwen3-0.6B                                    ours; theirs was Qwen3.5-2B-Base
#   trained         all tower weights except the input embedding,  theirs; plus our scorer
#                   plus the scorer
#   data            synth_train_questions.jsonl                     ours, converted from
#                                                                n4ze3m/typed-decisions-synth
#   objective       soft cross-entropy on the teacher distribution, theirs
#                   options shuffled per example
#   schedule        1,500 steps x batch 16                          theirs
#   tower lr        5e-6 cosine                                     theirs
#   head lr         1e-4 constant                                    theirs
#   precision       tower bf16 autocast + grad checkpointing,        theirs
#                   fp32 master; scorer fp32 OUTSIDE autocast
#   seeds           17 / 29 / 43, judged on the mean; 17 is primary  theirs
#
#   Two numbers are OURS rather than theirs, and are marked as such. Ours is 0.6B rather than 2B
#   and ours runs on one RTX 4070, so the schedule is scaled by measured throughput rather than
#   copied from a box we do not have. The ratio that matters -- 1,500 steps at batch 16 -- is kept
#   exactly, because it is what defines an epoch-like unit of distillation over 23,319 questions.
#
# WHY THE INPUT EMBEDDING IS FROZEN
#   Theirs. They record that fine-tuning the tower rather than freezing it was forced by a failure:
#   "every frozen variant stalled below the majority baseline whatever the head or the data". Ours
#   follows that finding rather than re-deriving it, and the freeze is applied here so the arm
#   measures the recipe rather than a different starting point.
#
# WHAT THIS ARM IS NOT
#   It is not the 0.7955 that the previous seed reported on a dev-derived split. That number came
#   from a model already trained on the benchmark's train split, and this arm starts from the bare
#   base model. The comparison between them is not a measurement of anything; it is the reason
#   arm 0 exists.

model_path: "E:/2026-AI4S/jev_repro/models/Qwen3-0.6B"
init_from: ""            # bare base model. Empty is the point: this arm starts from scratch.
set_dim: 256
set_layers: 2
set_heads: 4
encoder_impl: "path"
dtype: "float32"         # model dtype; training runs under bf16 autocast

# LoRA is NOT used. agentjev/train.py attaches an adapter only under `if args.lora`, a command-line
# switch rather than a config key, so omitting `--lora` leaves the whole tower trainable -- which is
# what RSI-Jev's v1.0 does ("all tower weights except the frozen input embedding"). A config key
# would not have worked: there is no `lora_r: 0` that means "off", and the key is absent from the
# list train.py actually reads.
#
# THE INPUT EMBEDDING. RSI-Jev freezes it. train.py groups embed_tokens under its own lr key but
# does not offer a freeze flag, so `lr.embed` is set to 0.0 below: a parameter group with lr 0
# receives no update, which is the same observable effect as freezing it. The value is therefore a
# real setting and not an inert placeholder -- it is the mechanism, and it is recorded as ours
# because the recipe is theirs and the mechanism is this repository's.

# --- schedule: RSI-Jev v1.0 -----------------------------------------------------------------
max_steps: 1500
grad_accum: 4             # ours: microbatch shape, for the 12 GB budget
batch_states: 4           # 4 x 4 = 16 states per optimiser step, matching their batch 16
max_len: 512
max_state_tokens: 256
seed: 17                 # theirs: seed 17, fixed in advance as primary

# --- learning rates: RSI-Jev v1.0 ------------------------------------------------------------
# Theirs is a single tower rate and a single head rate. Ours is written per layer group because that
# is what build_param_groups() expects; all four tower groups carry ONE value so the effective
# schedule is uniform, which is the thing being reproduced. The head is 20x the tower, as theirs.
lr:
  embed: 0.0             # frozen, per RSI-Jev v1.0 -- see the note above on why this is 0 and not
                         # a flag that does not exist
  bottom: 5.0e-6
  middle: 5.0e-6
  top: 5.0e-6
  head: 1.0e-4
weight_decay: 0.0        # ours: not in their recipe, so not introduced
warmup_ratio: 0.0        # theirs: none stated
grad_clip: 1.0
grad_checkpoint: true    # see the memory note below -- this is not optional on a 12 GB card

# --- objective --------------------------------------------------------------------------------
# Soft cross-entropy against the teacher distribution. The brier term is what this repository's own
# losses.py provides by default; RSI-Jev's objective is plain soft cross-entropy, so the auxiliary
# weights are zeroed here and the distillation objective is what the arm measures.
loss_weights:
  brier: 0.0
  margin: 0.0
  ordinal: 0.0
  perm_kl: 0.0
margin: 0.5

# --- data -------------------------------------------------------------------------------------
# ONE source. RSI-Jev's v1.0 trains on the synthetic distillation corpus alone; mixing the
# benchmark's own train split in would be their v2.0 move and would make this arm incomparable to
# their v1.0. The benchmark splits are declared with weight 0 so that their paths stay visible and
# their roles stay explicit rather than being silently absent.
data_sources:
  - name: "synth_distillation"
    path: "data/agentjev_splits/synth_train_questions.jsonl"
    weight: 1.0
  - name: "typed_decisions_dev"
    path: "data/agentjev_splits/dev_questions.jsonl"
    weight: 0.0        # evaluation only
  - name: "typed_decisions_calibration"
    path: "data/agentjev_splits/calibration_questions.jsonl"
    weight: 0.0        # calibration fitting only
  - name: "typed_decisions_shadow"
    path: "data/agentjev_splits/shadow_questions.jsonl"
    weight: 0.0        # audit only

log_every: 10
save_every_steps: 500   # a checkpoint every 500 steps, so a crash costs at most 500 steps
save_final: true
out_dir: "checkpoints/arm0_v1_0"
log_path: ".logs/arm0_v1_0.log"
log_reset: true

device: "cuda:0"
max_consec_fail: 25

# --- provenance -------------------------------------------------------------------------------
# Written from versions/v1.0.md of github.com/Shanghua-Gao/RSI-Jev and from its rsijev/README.md.
# The recipe is theirs; the backbone is ours; every number above is either quoted from their record
# or marked OURS in the comment that carries it.
_reference:
  repo: "https://github.com/Shanghua-Gao/RSI-Jev"
  record: "versions/v1.0.md section 2"
  their_base: "Qwen3.5-2B-Base"
  their_held_out_top1: 0.662
  their_hardware: "one H100 80 GB, ~13 min at 2B"
