# OASP pre-registered design constants.
#
# This file is a *mirror* of oasp/config.py::DESIGN for human review. The runner
# writes the values it actually used into runs/<run_id>/manifest.json and hashes
# them, so a post-hoc threshold change here is detectable against any run.

design:
  temperature: 0.0          # greedy: score differences are causal, not sampling noise
  seed: 42
  num_predict: 192          # must exceed the shortest compliant answer; 16 starves
                            # thinking models and manufactures parse failures
  n_variants: 32            # draws from a 180-point surface-feature space
  n_items_dev: 60
  n_items_test: 60
  n_items_test_confirmatory: 150   # H2 power requirement (protocol §6)
  noise_floor_seeds: 5
  noise_floor_temp: 0.7
  noise_floor_items: 20
  determinism_check_items: 20
  bootstrap_B: 2000
  permutation_B: 2000

# Decision rules — fixed before data collection (protocol §5).
decision_rules:
  h1_min_models: 2               # models that must pass, not "trend"
  h1_range_over_floor: 2.0       # spread must exceed twice the noise floor
  h1_max_tau: 0.95               # below this, model rankings are not invariant
  h3_kruskal_p: 0.05
  h3_min_epsilon_sq: 0.06        # below this, "death valleys" is decorative
  bh_q: 0.05                     # Benjamini-Hochberg across models x benchmarks
  alpha: 0.05

benchmarks:
  arc_easy:
    repo: allenai/ai2_arc
    file: ARC-Easy/test-00000-of-00001.parquet
    role: primary            # easier -> small targets clear the capability floor
  arc_challenge:
    repo: allenai/ai2_arc
    file: ARC-Challenge/test-00000-of-00001.parquet
    role: generality         # difficulty manipulation + floor control

targets:
  gemma3_4b:    {backend: ollama, model_id: "gemma3:4b",                 role: target}
  qwen3_4b:     {backend: ollama, model_id: "qwen3:4b",                  role: target, think: false}
  mistral_7b:   {backend: ollama, model_id: "mistral:7b",                role: target}
  gemma3_12b:   {backend: ollama, model_id: "gemma3:12b",                role: target}
  deepseek_r1_7b: {backend: ollama, model_id: "deepseek-r1-qwen-7b:Q4_K_M", role: target, think: false,
                   status: excluded_pilot, reason: "parse rate 0.00-0.05: emits reasoning only, no parseable answer"}

optimizers:
  llm_optimizer: {backend: openrouter, model_id: "deepseek/deepseek-chat-v3.1", role: optimizer}

# Constraint 3 of the brief (optimizer and target must be decoupled) is enforced by
# oasp/config.py::assert_decoupled(), which raises at load time on any overlap.
decoupling_enforced: true
